name: CI

# The gate for the rebuild. Before this file, `.github/` contained only `.keep` —
# there was no CI at all, so this pipeline is created from nothing rather than
# extended. Every step here must be able to fail; see docs/ci-gate.md for the
# recorded run that proves it.
# BRANCH LISTS ARE EXACT NAMES, NOT GLOBS, AND THAT IS THE WHOLE BUG THIS
# CARRIES. Until 2026-08-30 these read `develop/**`, produced by renaming
# `rebuild/**` when the integration branch moved. The glob was only ever correct
# because the OLD branch had a slash in it: `rebuild/**` matches `rebuild/v1`,
# while `develop/**` requires a literal `develop/` prefix and so matches neither
# the branch `develop` nor a pull request into it. Measured that day: ZERO runs
# on `develop` ever, and the `develop -> release` promotion PR -- the merge that
# deploys production -- carried Vercel checks and no test run at all.
#
# src/test/gate.test.js asserts this list against the branch model in README.md,
# because a trigger list is exactly the kind of claim that is satisfied by
# inspection and false in practice (#243 AC 3).
on:
  push:
    branches: ['develop', 'release', 'main', 'feature/**']
  pull_request:
    branches: ['develop', 'release', 'main']

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # #540 AC 6 -- a promotion into `release` must carry a new release
      # version, strictly greater by SemVer than the one `release` has now.
      # Only a pull request INTO release is checked: a story into `develop`
      # does not bump, and `main` is entered from `release`, which already did.
      # `actions/checkout@v4` clones at depth 1 (the merge commit alone), so
      # `release` and the pull request's head are fetched here by name rather
      # than assumed present. It is a step of THIS job, not a job of its own,
      # because the ruleset requires this job's check (`Lint, test, build`) on
      # `release` -- a separate job would be a check nothing requires.
      # src/test/gate.test.js holds this step to that shape.
      - name: A promotion into release carries a new version
        if: github.event_name == 'pull_request' && github.base_ref == 'release'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/release:refs/remotes/origin/release "$HEAD_SHA"
          node scripts/check-release-version.mjs --head "$HEAD_SHA" --base origin/release

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `vitest run` exits non-zero when it finds no test files, and
      # passWithNoTests is pinned to false in vite.config.js so that stays true
      # if the default ever changes. src/test/gate.test.js asserts the pin.
      # #555 -- it also writes the JSON report the next step reads, through a
      # reporter that adds each file's own duration (the stock one leaves a
      # beforeAll out; the reporter's header has the measurement).
      - name: Test
        run: npm test -- --reporter=default --reporter=./scripts/vitest-json-file-durations.mjs --outputFile.json=vitest-report.json

      # #555 -- the summed wall time of every *.pglite.test.js file stays under
      # a ceiling, so the PGlite work in the tune-up (#557) is a gain that
      # stays. 3200 s is CI's highest reading over the 12 green runs before
      # 2026-09-22 (2,317-2,915 s, read off each run's per-file lines) plus
      # about 10% -- an owner decision at #555's pickup, over the 4,400 s the
      # issue named, which was a local run with 23 workers contending. The
      # story that makes PGlite faster lowers it.
      - name: PGlite test time stays under its ceiling
        run: node scripts/summarize-vitest.mjs vitest-report.json --budget 3200

      - name: Build
        run: npm run build

      # A build that emits nothing is a build that passed vacuously. This is the
      # cheapest possible check that the previous step produced a real artefact.
      - name: Assert the build produced an artefact
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing - build emitted nothing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::manifest missing - PWA would not install"; exit 1; }
          test -f dist/sw.js || { echo "::error::service worker missing - PWA would not install"; exit 1; }
          echo "dist/ contains index.html, manifest.webmanifest and sw.js"

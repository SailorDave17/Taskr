<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- #484 — the three things iOS does NOT read from the manifest. The icon
         link is the only route to a home-screen icon (without it iOS screenshots
         the page); `-capable` is what older iOS reads for full-screen instead of
         the manifest's `display: standalone`; `-title` is the name under the
         icon. Recent iOS takes the name, `start_url` and display mode from the
         manifest, so these three are the whole of the gap. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Taskr" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6f5c" />
    <meta name="description" content="Splits a household's chores by the time each person has." />
    <title>Taskr</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
